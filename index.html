<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷霆战机 - 2D 飞行射击游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; display: flex; justify-content: center; align-items: center;
    height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; user-select: none;
  }
  #gameWrap {
    position: relative;
    box-shadow: 0 0 60px rgba(0,150,255,.4), 0 0 120px rgba(0,80,255,.2);
    border: 2px solid #1a4a8a; border-radius: 6px;
  }
  canvas { display: block; background: #04070f; cursor: none; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; color: #dff3ff; font-size: 15px;
    text-shadow: 0 0 8px rgba(0,180,255,.9); letter-spacing: 1px;
  }
  #hud.hidden { display: none; }
  #hud .score { font-size: 20px; font-weight: bold; color: #ffd94d; }
  #hud .lives { color: #ff6b6b; font-size: 18px; }
  .power-bar { width: 80px; height: 7px; margin: 2px 0; background: rgba(255,255,255,.12); border-radius: 4px; overflow: hidden; border: 1px solid rgba(120,200,255,.4); }
  .power-fill { height: 100%; width: 20%; background: linear-gradient(90deg,#00e5ff,#7c4dff); transition: width .2s; border-radius: 4px; }
  .power-fill.p2 { background: linear-gradient(90deg,#7cffa0,#00c853); }
  #powerBars { display: flex; gap: 12px; align-items: center; font-size: 11px; }
  #powerBars .bar-wrap { display: flex; align-items: center; gap: 5px; }

  /* ---------- 覆盖层 / 屏幕 ---------- */
  .screen {
    position: absolute; inset: 0; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center;
    background: rgba(2,6,16,.92); color: #fff; pointer-events: auto;
    padding: 24px 18px;
  }
  .screen.hidden { display: none !important; }
  .screen h1 {
    font-size: 44px; letter-spacing: 6px;
    background: linear-gradient(180deg,#fff,#40c4ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; margin-bottom: 6px;
    filter: drop-shadow(0 0 24px rgba(64,196,255,.6));
  }
  .screen h2 { font-size: 26px; margin: 10px 0 8px; color: #8be9ff; letter-spacing: 2px; }
  .screen p { font-size: 14px; margin: 4px 0; color: #cfe8ff; line-height: 1.6; }
  .screen .final { font-size: 28px; font-weight: bold; color: #ffd94d; margin: 8px 0; }

  .btn {
    margin: 6px 0; padding: 11px 34px; min-width: 200px; font-size: 17px;
    letter-spacing: 3px; color: #fff; background: linear-gradient(135deg,#0066ff,#00b8ff);
    border: none; border-radius: 26px; cursor: pointer;
    box-shadow: 0 0 20px rgba(0,150,255,.55); transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: scale(1.05); box-shadow: 0 0 34px rgba(0,200,255,.9); }
  .btn.ghost { background: rgba(255,255,255,.08); box-shadow: none; }
  .btn.small { min-width: 0; padding: 6px 14px; font-size: 13px; letter-spacing: 1px; }
  .btn.danger { background: linear-gradient(135deg,#c0392b,#e74c3c); box-shadow: 0 0 14px rgba(255,60,40,.4); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  input[type=text], input[type=password] {
    padding: 9px 13px; font-size: 15px; color: #8be9ff; text-align: center;
    background: rgba(0,0,0,.5); border: 2px solid #1a5a9a; border-radius: 22px; outline: none;
    transition: border .2s;
  }
  input:focus { border-color: #40c4ff; }

  /* ---------- 登录 ---------- */
  #accGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0; }
  .acc-card {
    padding: 12px 6px; text-align: center; background: rgba(10,40,80,.5);
    border: 2px solid rgba(80,160,255,.25); border-radius: 10px; cursor: pointer;
    transition: all .15s; width: 76px;
  }
  .acc-card:hover { border-color: #40c4ff; transform: translateY(-2px); }
  .acc-card.sel { border-color: #ffd94d; background: rgba(255,200,60,.12); box-shadow: 0 0 16px rgba(255,217,77,.4); }
  .acc-card .nm { font-size: 14px; color: #dff3ff; }
  .acc-card .id { font-size: 11px; color: #6fa8d8; margin-top: 3px; letter-spacing: 1px; }
  #loginRow { display: flex; gap: 8px; align-items: center; margin-top: 4px; }

  /* ---------- 菜单 ---------- */
  #userBar {
    width: 100%; max-width: 400px; display: flex; align-items: center; gap: 8px;
    background: rgba(10,30,60,.6); border: 1px solid rgba(80,160,255,.3);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 8px;
  }
  #userBar .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg,#0066ff,#00e5ff);
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px;
  }
  #userBar .uinfo { flex: 1; text-align: left; line-height: 1.4; }
  #userBar .uinfo .uname { font-size: 16px; color: #fff; }
  #userBar .uinfo .uuid { font-size: 11px; color: #6fa8d8; letter-spacing: 1px; }
  .edit-name { cursor: pointer; color: #40c4ff; font-size: 13px; }

  .panel {
    width: 100%; max-width: 400px; background: rgba(10,30,60,.6);
    border: 1px solid rgba(80,160,255,.3); border-radius: 12px; padding: 12px 14px; margin: 6px 0;
    text-align: left;
  }
  .panel h3 { font-size: 14px; letter-spacing: 2px; color: #8be9ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .menu-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  .friend-row, .lb-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 2px;
    border-bottom: 1px solid rgba(80,160,255,.12); font-size: 13px;
  }
  .friend-row:last-child { border-bottom: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.on { background: #4cff8b; box-shadow: 0 0 8px #4cff8b; }
  .dot.off { background: #555; }
  .fname { flex: 1; color: #dff3ff; }
  .fuid { color: #6fa8d8; font-size: 11px; letter-spacing: 1px; }
  .muted { color: #7fb0e0; font-size: 11px; }
  .add-row { display: flex; gap: 6px; margin-top: 8px; }
  .add-row input { flex: 1; }

  /* ---------- 房间 ---------- */
  #roomCode { font-size: 42px; font-weight: bold; letter-spacing: 8px; color: #ffd94d; text-shadow: 0 0 20px rgba(255,217,77,.7); margin: 8px 0; }
  #roomStatus { color: #8be9ff; font-size: 14px; min-height: 22px; }

  /* ---------- 邀请弹窗 ---------- */
  #inviteModal {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); pointer-events: auto; z-index: 50;
  }
  #inviteModal.hidden { display: none !important; }
  #inviteBox {
    background: rgba(8,25,50,.97); border: 1px solid #40c4ff; border-radius: 14px;
    padding: 22px 30px; text-align: center; box-shadow: 0 0 40px rgba(0,180,255,.5);
  }
  #inviteBox h3 { color: #ffd94d; font-size: 22px; margin-bottom: 6px; }
  #inviteBox p { color: #cfe8ff; margin-bottom: 14px; }
  #inviteBox .btns { display: flex; gap: 10px; justify-content: center; }

  /* ---------- toast ---------- */
  #toast {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(10,40,80,.95); border: 1px solid #40c4ff; color: #dff3ff;
    padding: 8px 20px; border-radius: 20px; font-size: 14px; pointer-events: none;
    opacity: 0; transition: opacity .3s; z-index: 99;
  }
  #toast.show { opacity: 1; }

  .key-hint { position: absolute; bottom: 10px; left: 16px; color: rgba(180,210,255,.55); font-size: 12px; pointer-events: none; letter-spacing: 1px; }

  .hud-btn {
    pointer-events: auto;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(120,200,255,.5);
    color: #dff3ff; border-radius: 14px;
    padding: 4px 12px; font-size: 12px;
    cursor: pointer; letter-spacing: 1px;
    transition: all .15s; flex: none;
  }
  .hud-btn:hover { background: rgba(255,80,80,.35); border-color: #ff6b6b; }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game" width="480" height="700"></canvas>

  <div id="hud" class="hidden">
    <div>
      <div>得分 <span class="score" id="score">0</span></div>
      <div style="font-size:12px;opacity:.8">最高 <span id="high">0</span></div>
    </div>
    <div id="powerBars"></div>
    <div class="lives" id="lives">❤ ❤ ❤</div>
    <button class="hud-btn" id="btnMusic" title="关闭背景音乐">🎵</button>
    <button class="hud-btn" id="btnHudQuit" title="暂停并退出游戏">退出</button>
  </div>

  <!-- 登录 -->
  <div id="login" class="screen">
    <h1>雷霆战机</h1>
    <p>选择测试账户，输入密码登录</p>
    <div id="accGrid"></div>
    <div id="loginRow">
      <input id="pwdInput" type="password" placeholder="请输入密码" maxlength="20">
      <button class="btn small" id="btnLogin">登 录</button>
    </div>
    <p class="muted" id="loginStatus" style="margin-top:8px"></p>
  </div>

  <!-- 主菜单 -->
  <div id="menu" class="screen hidden">
    <h1>雷霆战机</h1>
    <div id="userBar">
      <div class="avatar" id="avatar">⚡</div>
      <div class="uinfo">
        <div class="uname"><span id="myName">--</span> <span class="edit-name" id="btnEditName">✏️改昵称</span></div>
        <div class="uuid">UID: <span id="myUid">------</span></div>
      </div>
      <button class="btn ghost small" id="btnLogout">退出</button>
    </div>

    <div class="menu-btns">
      <button class="btn" id="btnSolo">单人游戏</button>
      <button class="btn" id="btnHost">开房间游玩</button>
    </div>
    <div class="add-row" style="margin-top:10px">
      <input type="text" id="joinRoomInput" placeholder="输入房间码加入（如 TABC1）" maxlength="6" autocomplete="off">
      <button class="btn small" id="btnJoinRoom">加入房间</button>
    </div>

    <div class="panel" id="friendPanel">
      <h3>👥 好友 <span class="muted" id="friendCount"></span></h3>
      <div id="friendList"><div class="muted">暂无好友，输入好友 UID 添加</div></div>
      <div class="add-row">
        <input type="text" id="addFriendInput" placeholder="输入好友 UID（如 TF1001）" maxlength="8">
        <button class="btn small" id="btnAddFriend">添加</button>
      </div>
    </div>

    <div class="panel">
      <h3>🏆 排行榜</h3>
      <div id="lbList"><div class="muted">加载中...</div></div>
    </div>

    <div class="panel">
      <h3>📊 我的战绩</h3>
      <div id="myScores"><div class="muted">暂无记录</div></div>
    </div>
  </div>

  <!-- 房间 -->
  <div id="room" class="screen hidden">
    <h2>联机房间</h2>
    <p id="roomHint">房间码（分享给好友）</p>
    <div id="roomCode">------</div>
    <p id="roomStatus">等待玩家加入...</p>
    <button class="btn ghost small" id="btnCopy">📋 复制邀请链接</button>
    <button class="btn" id="btnLeave">返回菜单</button>
  </div>

  <!-- 游戏结束 -->
  <div id="over" class="screen hidden">
    <h1>游戏结束</h1>
    <p class="final" id="finalScore"></p>
    <button class="btn" id="btnRestart">再来一局</button>
    <button class="btn ghost" id="btnMenu">返回菜单</button>
  </div>

  <!-- 暂停菜单 -->
  <div id="pauseMenu" class="screen hidden">
    <h1 style="font-size:38px">游戏暂停</h1>
    <p class="muted" id="pauseScore"></p>
    <button class="btn" id="btnResume">继续游戏</button>
    <button class="btn ghost" id="btnQuitGame">退出游戏</button>
  </div>

  <!-- 邀请弹窗 -->
  <div id="inviteModal" class="hidden">
    <div id="inviteBox">
      <h3 id="inviteTitle">邀请</h3>
      <p id="inviteText"></p>
      <div class="btns">
        <button class="btn small" id="btnAccept">接受</button>
        <button class="btn small ghost" id="btnDecline">拒绝</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div class="key-hint">ESC 暂停 · 空格/点击 炸弹</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ==================== 网络 / 账号状态 ====================
  let token = localStorage.getItem('thunder.token') || null;
  let me = { uid: '', name: '' };
  let ws = null;
  let wsRetry = null;
  let friends = [];       // [{uid,name,online}]
  let selectedUid = null;
  let inviteState = null; // { role:'host'|'guest', peerUid, peerName }

  const $ = id => document.getElementById(id);
  const screens = { login: $('login'), menu: $('menu'), room: $('room'), over: $('over') };
  const hud = $('hud'), scoreEl = $('score'), highEl = $('high'), livesEl = $('lives'), powerBars = $('powerBars');

  function showScreen(name) {
    for (const k in screens) screens[k].classList.toggle('hidden', k !== name);
    hud.classList.toggle('hidden', name !== 'game');
    if (name === 'game') $('pauseMenu').classList.add('hidden');
  }

  let toastTimer = null;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      method: opts.method || 'GET',
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
        ...(opts.headers || {}),
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '请求失败');
    return data;
  }

  // ==================== 数据存储（本地最高分） ====================
  const Store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    getHigh() { return this.get('thunder.high', 0); },
    setHigh(v) { this.set('thunder.high', v); },
  };

  // ==================== 音效 ====================
  let actx = null;
  function initAudio() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); }
  function beep(freq, dur, type = 'square', vol = 0.12, slide = 0) {
    if (!actx) return;
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur);
  }
  const sfx = {
    shoot() { beep(880, 0.05, 'square', 0.05, -400); },
    boom() { beep(120, 0.3, 'sawtooth', 0.2, -80); },
    hit() { beep(200, 0.15, 'square', 0.15, -120); },
    power() { beep(520, 0.12, 'triangle', 0.18, 300); beep(780, 0.14, 'triangle', 0.16, 300); },
    bomb() { beep(60, 0.7, 'sawtooth', 0.3, -30); },
    over() { beep(400, 0.6, 'sawtooth', 0.18, -360); },
    join() { beep(660, 0.1, 'triangle', 0.2, 200); beep(990, 0.15, 'triangle', 0.2, 200); },
  };

  // ==================== 背景音乐（经典雷霆战机风格，Web Audio 实时合成） ====================
  const MIDI = n => 440 * Math.pow(2, (n - 69) / 12);
  let bgmOn = true;
  let bgmTimer = null;
  let bgmNextTime = 0;
  let bgmStep = 0;
  const BGM_STEP = 60 / 138 / 4; // BPM 138，16 分音符时长
  // 主旋律（64 步，Am-F-C-G 循环，0=休止）
  const BGM_MELODY = [
    69,0,69,0,72,0,69,0,76,0,74,0,72,0,71,0,
    65,0,65,0,69,0,65,0,72,0,71,0,69,0,67,0,
    64,0,64,0,67,0,64,0,71,0,69,0,67,0,65,0,
    62,0,62,0,65,0,62,0,69,0,67,0,65,0,64,0,
  ];
  // 贝斯根音（A2 F2 C2 G2，每 2 步一个）
  const BGM_BASS = [45,41,36,43].map(n => [n,n,n,n,n,n,n,n]).flat();
  // 鼓点步位
  const BGM_KICK = [0, 12, 16, 28, 32, 44, 48, 60];
  const BGM_SNARE = [8, 24, 40, 56];

  function bgmTone(freq, time, dur, type, vol) {
    if (!actx || !bgmOn) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g).connect(actx.destination);
    o.start(time); o.stop(time + dur + 0.02);
  }
  function bgmKick(time) {
    if (!actx || !bgmOn) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, time);
    o.frequency.exponentialRampToValueAtTime(45, time + 0.1);
    g.gain.setValueAtTime(0.5, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.13);
    o.connect(g).connect(actx.destination);
    o.start(time); o.stop(time + 0.15);
  }
  function bgmNoise(time, dur, vol, hpFreq) {
    if (!actx || !bgmOn) return;
    const len = Math.max(1, Math.ceil(actx.sampleRate * dur));
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource();
    src.buffer = buf;
    const f = actx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hpFreq;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    src.connect(f).connect(g).connect(actx.destination);
    src.start(time); src.stop(time + dur + 0.02);
  }
  function scheduleBGM() {
    if (!actx) return;
    while (bgmNextTime < actx.currentTime + 0.12) {
      const step = bgmStep % 64;
      const t = bgmNextTime;
      const m = BGM_MELODY[step];
      if (m) bgmTone(MIDI(m), t, BGM_STEP * 0.9, 'square', 0.04);
      if (step % 2 === 0) bgmTone(MIDI(BGM_BASS[step] - 12), t, BGM_STEP * 1.7, 'sawtooth', 0.05);
      if (BGM_KICK.includes(step)) bgmKick(t);
      if (BGM_SNARE.includes(step)) bgmNoise(t, 0.1, 0.1, 1800);
      if (step % 2 === 1) bgmNoise(t, 0.03, 0.025, 6000);
      bgmNextTime += BGM_STEP;
      bgmStep++;
    }
  }
  function startBGM() {
    if (!actx || bgmTimer || !bgmOn) return;
    bgmNextTime = actx.currentTime + 0.05;
    bgmStep = 0;
    bgmTimer = setInterval(scheduleBGM, 25);
  }
  function stopBGM() {
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
  }
  function toggleBGM() {
    bgmOn = !bgmOn;
    if (bgmOn) { initAudio(); startBGM(); } else stopBGM();
    const b = $('btnMusic');
    if (b) { b.textContent = bgmOn ? '🎵' : '🔇'; b.title = bgmOn ? '关闭背景音乐' : '打开背景音乐'; }
  }

  // ==================== 工具 ====================
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;
  function circleHit(a, b) { const r = a.r + b.r; return dist2(a.x, a.y, b.x, b.y) < r * r; }

  const ENEMY_TYPES = [
    { r: 14, hp: 1, speed: 150, score: 100, color: '#e8556d' },
    { r: 17, hp: 2, speed: 105, score: 200, color: '#c86be8' },
    { r: 20, hp: 4, speed: 90,  score: 350, color: '#e8972e' },
    { r: 34, hp: 60, speed: 45, score: 5000, color: '#ff4455' },
  ];

  class Particle {
    constructor(x, y, color, speed, life, size) {
      this.x = x; this.y = y;
      const a = rand(0, Math.PI * 2), s = rand(0.3, 1) * speed;
      this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
      this.life = life; this.maxLife = life;
      this.size = size || rand(1.5, 4); this.color = color;
    }
    update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.vx *= 0.98; this.vy *= 0.98; this.life -= dt; }
  }
  function explode(x, y, color, n = 22, speed = 220, sound = '') {
    for (let i = 0; i < n; i++) game.particles.push(new Particle(x, y, color, speed, rand(0.25, 0.7), rand(1.5, 4.5)));
    if (game.events) game.events.push([x, y, color, n, sound]);
  }

  class Star {
    constructor() { this.reset(true); }
    reset(init) { this.x = rand(0, W); this.y = init ? rand(0, H) : -5; this.speed = rand(40, 180); this.size = rand(0.5, 2.2); this.tw = rand(0.3, 1); }
    update(dt) { this.y += this.speed * dt; if (this.y > H) this.reset(false); }
  }

  // ==================== 玩家 ====================
  const PLAYER_COLORS = ['#4db8ff', '#4dff88'];
  class Player {
    constructor(index) {
      this.index = index;
      this.x = W / 2 + (index ? 40 : 0);
      this.y = H - 90;
      this.r = 16; this.speed = 320;
      this.power = 1; this.bombs = 2; this.inv = 0;
      this.shootCd = 0; this.shootRate = 0.14; this.trail = 0;
      this.color = PLAYER_COLORS[index] || '#4db8ff';
    }
    applyInput(dt) {
      if (keys.has('ArrowLeft') || keys.has('a')) this.x -= this.speed * dt;
      if (keys.has('ArrowRight') || keys.has('d')) this.x += this.speed * dt;
      if (keys.has('ArrowUp') || keys.has('w')) this.y -= this.speed * dt;
      if (keys.has('ArrowDown') || keys.has('s')) this.y += this.speed * dt;
      if (mouse.active) {
        this.x += (mouse.x - this.x) * Math.min(1, dt * 14);
        this.y += (mouse.y - this.y) * Math.min(1, dt * 14);
      }
      this.clamp();
    }
    clamp() { this.x = clamp(this.x, 20, W - 20); this.y = clamp(this.y, 50, H - 20); }
    tick(dt) {
      if (this.inv > 0) this.inv -= dt;
      if (this.shootCd > 0) this.shootCd -= dt;
      this.trail -= dt;
      if (this.trail <= 0) {
        this.trail = 0.03;
        game.particles.push(new Particle(this.x + rand(-4, 4), this.y + 18,
          this.index === 1 ? '#7cffa0' : rand(0, 1) < 0.5 ? '#ffaa33' : '#33ccff', 90, 0.35, rand(1.5, 3)));
      }
      if (this.shootCd <= 0) this.shoot();
    }
    shoot() {
      this.shootCd = this.shootRate;
      const p = this.power, bx = this.x, by = this.y;
      const list = [];
      if (p === 1) list.push([bx, by - 20, 0]);
      else if (p === 2) list.push([bx - 9, by - 14, 0], [bx + 9, by - 14, 0]);
      else if (p === 3) list.push([bx, by - 22, 0], [bx - 12, by - 12, 0], [bx + 12, by - 12, 0]);
      else if (p === 4) list.push([bx - 9, by - 16, -0.16], [bx + 9, by - 16, 0.16], [bx - 15, by - 10, 0], [bx + 15, by - 10, 0]);
      else list.push([bx, by - 24, 0], [bx - 10, by - 16, -0.22], [bx + 10, by - 16, 0.22], [bx - 18, by - 10, 0], [bx + 18, by - 10, 0]);
      for (const [x, y, dir] of list) game.bullets.push({ x, y, vx: dir * 260, vy: -720, r: 5 });
      sfx.shoot();
    }
  }

  class Enemy {
    constructor(type, x, y) {
      this.type = type;
      const t = ENEMY_TYPES[type];
      this.x = x !== undefined ? x : rand(25, W - 25);
      this.y = y !== undefined ? y : -30;
      this.r = t.r;
      // 随时间增加小兵血量（游戏 20 秒后开始强化，120 秒后达到 +100%）
      const timeBonus = Math.min(1, Math.max(0, (game.time - 20) / 100));
      this.hp = this.maxHp = Math.round(t.hp * (1 + timeBonus));
      this.speed = t.speed * rand(0.85, 1.2);
      this.vx = type === 1 ? rand(-60, 60) : 0;
      this.score = Math.round(t.score * (1 + timeBonus * 0.5)); this.color = t.color;
      this.shootCd = type >= 1 ? rand(0.8, 1.6) : Infinity;
      this.wobble = rand(0, Math.PI * 2);
      this.dead = false;
    }
    update(dt) {
      this.y += this.speed * dt;
      if (this.type === 2) {
        this.x += Math.sin(this.y * 0.02 + this.wobble) * 40 * dt;
      } else if (this.type === 1) {
        this.x += this.vx * dt;
        if (this.x < 20 || this.x > W - 20) this.vx *= -1;
        this.shootCd -= dt;
        if (this.shootCd <= 0 && this.y > 0 && this.y < H - 200) {
          this.shootCd = rand(0.9, 1.7);
          game.eBullets.push({ x: this.x, y: this.y + 18, vx: 0, vy: 260, r: 6 });
        }
      } else if (this.type === 3) {
        this.x = W / 2 + Math.sin(this.y * 0.01) * 80;
        this.shootCd -= dt;
        if (this.shootCd <= 0 && this.y > 40 && this.y < H - 300) {
          this.shootCd = 0.5;
          for (let i = -2; i <= 2; i++) game.eBullets.push({ x: this.x + i * 18, y: this.y + 30, vx: i * 30, vy: 240, r: 6 });
        }
      }
      if (this.y > H + 50) this.dead = true;
    }
  }

  class PowerUp {
    constructor(x, y, kind) { this.x = x; this.y = y; this.kind = kind; this.r = 13; this.vy = 110; this.dead = false; this.t = 0; }
    update(dt) { this.t += dt; this.y += this.vy * dt; this.x += Math.sin(this.t * 3) * 30 * dt; if (this.y > H + 20) this.dead = true; }
  }

  // ==================== 游戏状态 ====================
  let game = null;
  let running = false, paused = false;
  let mode = 'solo';
  let waitingForGuest = false;
  let guestX = W / 2 + 40, guestY = H - 90;

  function initGame(playerCount) {
    game = {
      players: Array.from({ length: playerCount }, (_, i) => new Player(i)),
      lives: playerCount === 1 ? 3 : 5,
      maxLives: playerCount === 1 ? 3 : 5,
      bullets: [], eBullets: [], enemies: [], powerups: [],
      particles: [], events: [],
      stars: Array.from({ length: 70 }, () => new Star()),
      score: 0, kills: 0,
      spawnTimer: 0, nextBossTime: 30, bossSpawned: false,
      time: 0, shake: 0,
    };
    running = true; paused = false;
    updateHUD();
  }

  function updateHUD() {
    if (!game) return;
    scoreEl.textContent = game.score;
    highEl.textContent = Store.getHigh();
    livesEl.textContent = '❤'.repeat(Math.min(game.lives, 6)) + '🖤'.repeat(Math.max(0, game.maxLives - game.lives));
    if (mode === 'solo') {
      powerBars.innerHTML = `<div class="bar-wrap">火力<div class="power-bar"><div class="power-fill" id="pf0"></div></div></div>`;
      document.getElementById('pf0').style.width = (game.players[0].power / 5 * 100) + '%';
    } else {
      powerBars.innerHTML = `<div class="bar-wrap" style="color:#4db8ff">P1<div class="power-bar"><div class="power-fill" id="pf0"></div></div></div>
        <div class="bar-wrap" style="color:#4dff88">P2<div class="power-bar"><div class="power-fill p2" id="pf1"></div></div></div>`;
      document.getElementById('pf0').style.width = (game.players[0].power / 5 * 100) + '%';
      document.getElementById('pf1').style.width = (game.players[1].power / 5 * 100) + '%';
    }
  }

  function spawnEnemy() {
    const t = game.time, r = Math.random();
    let type;
    if (t < 8) type = r < 0.75 ? 0 : 1;
    else if (t < 20) type = r < 0.5 ? 0 : (r < 0.85 ? 1 : 2);
    else type = r < 0.35 ? 0 : (r < 0.7 ? 1 : 2);
    game.enemies.push(new Enemy(type));
  }
  function spawnBoss() {
    if (game.bossSpawned) return;
    game.bossSpawned = true;
    game.nextBossTime = game.time + 45; // 45 秒后下一波 Boss
    const boss = new Enemy(3);
    // Boss 血量随时间递增：第一波 60，之后每波 +70%
    const wave = Math.floor(game.time / 45) + 1;
    let hp = Math.round(60 * (1 + (wave - 1) * 0.7));
    if (game.players.length > 1) hp = Math.round(hp * 1.5);
    boss.hp = boss.maxHp = hp;
    game.enemies.push(boss);
  }
  function dropPowerUp(x, y) {
    const r = Math.random();
    game.powerups.push(new PowerUp(x, y, r < 0.45 ? 'P' : r < 0.7 ? 'H' : 'B'));
  }

  function playerHit(idx) {
    const p = game.players[idx];
    if (!p || p.inv > 0) return;
    game.lives--;
    p.power = Math.max(1, p.power - 1);
    p.inv = 2;
    explode(p.x, p.y, '#ff6b6b', 16, 180, 'hit');
    sfx.hit();
    updateHUD();
    if (game.lives <= 0) endGame();
  }

  function bomb(idx) {
    const p = game.players[idx];
    if (!p || p.bombs <= 0) return;
    p.bombs--; sfx.bomb(); game.shake = 0.6;
    game.eBullets = [];
    for (const e of game.enemies) {
      e.hp -= 15;
      explode(e.x, e.y, '#ffcc00', 10, 180, 'boom');
      if (e.hp <= 0) {
        e.dead = true; addScore(e.score);
        if (e.type === 3) game.bossSpawned = false; // Boss 被炸弹击杀后允许下一波
      }
    }
    for (let i = 0; i < 40; i++) game.particles.push(new Particle(rand(0, W), rand(0, H), '#ffd94d', 500, 0.5, rand(2, 5)));
  }

  function addScore(n) {
    game.score += n;
    if (game.score > Store.getHigh()) Store.setHigh(game.score);
    updateHUD();
  }

  async function recordScore() {
    if (!token || !game) return;
    try {
      await api('/api/scores', { method: 'POST', body: { score: game.score, kills: game.kills, mode: mode === 'solo' ? 'solo' : 'multi' } });
    } catch (e) {}
  }

  function endGame() {
    if (!running) return;
    running = false;
    stopBGM();
    sfx.over();
    explode(game.players[0].x, game.players[0].y, '#ff6b6b', 40, 300, 'over');
    $('finalScore').textContent = '最终得分 ' + game.score + (mode === 'host' || mode === 'guest' ? '（联机合作）' : '');
    $('btnRestart').style.display = (mode === 'solo' || mode === 'host') ? '' : 'none';
    if (mode === 'host') Net.send({ t: 'over', score: game.score });
    recordScore();
    showScreen('over');
  }

  // ==================== PeerJS 联机（游戏数据传输） ====================
  const Net = {
    peer: null, conn: null, code: null, stateTimer: 0,
    onOpen: null, onConnected: null, onGuestJoin: null, onPeerLeft: null, onHostLeft: null, onError: null,
    genCode() {
      const cs = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
      let s = 'T';
      for (let i = 0; i < 5; i++) s += cs[Math.floor(Math.random() * cs.length)];
      return s;
    },
    available() { return typeof Peer !== 'undefined'; },
    host() {
      const code = this.genCode();
      this.code = code;
      this.peer = new Peer(code, { debug: 0 });
      this.peer.on('open', () => this.onOpen && this.onOpen(code));
      this.peer.on('connection', conn => {
        if (this.conn) { conn.on('open', () => conn.close()); return; }
        this.conn = conn;
        conn.on('open', () => this.onGuestJoin && this.onGuestJoin());
        conn.on('data', d => this.onData(d));
        conn.on('close', () => { if (this.conn === conn) { this.conn = null; this.onPeerLeft && this.onPeerLeft(); } });
      });
      this.peer.on('error', e => { if (e.type === 'unavailable-id') { this.peer.destroy(); this.host(); } });
    },
    join(code) {
      this.code = code;
      this.peer = new Peer();
      this.peer.on('open', () => {
        const conn = this.peer.connect(code, { reliable: true });
        this.conn = conn;
        conn.on('open', () => this.onConnected && this.onConnected());
        conn.on('data', d => this.onData(d));
        conn.on('close', () => this.onHostLeft && this.onHostLeft());
      });
      this.peer.on('error', e => this.onError && this.onError(e));
    },
    onData(d) {
      if (!d || !d.t) return;
      if (mode === 'host') {
        if (d.t === 'input') { guestX = d.x; guestY = d.y; }
        else if (d.t === 'bomb') bomb(1);
      } else {
        if (d.t === 'state') applySnapshot(d);
        else if (d.t === 'over') {
          if (running) { running = false; $('finalScore').textContent = '最终得分 ' + d.score + '（联机合作）'; $('btnRestart').style.display = 'none'; recordScore(); showScreen('over'); }
        } else if (d.t === 'restart') { initView(); showScreen('game'); sfx.join(); }
      }
    },
    isHost() { return mode === 'host'; },
    send(obj) { if (this.conn && this.conn.open) this.conn.send(obj); },
    sendState() { if (this.conn && this.conn.open) this.send({ t: 'state', s: snapshot() }); },
    close() {
      try { if (this.conn) this.conn.close(); } catch (e) {}
      try { if (this.peer) this.peer.destroy(); } catch (e) {}
      this.conn = null; this.peer = null; this.code = null;
    },
  };

  function snapshot() {
    return {
      players: game.players.map(p => [p.x, p.y, p.power, p.inv, p.bombs]),
      lives: game.lives, maxLives: game.maxLives,
      enemies: game.enemies.map(e => [e.type, e.x, e.y, e.hp]),
      eBullets: game.eBullets.map(b => [b.x, b.y]),
      bullets: game.bullets.map(b => [b.x, b.y, b.vx]),
      powerups: game.powerups.map(p => [p.x, p.y, p.kind]),
      score: game.score, events: game.events,
    };
  }
  function applySnapshot(d) {
    const s = d.s;
    if (!game || !Array.isArray(game.players) || game.players.length < 2) initView();
    const self = game.players[1];
    const myX = self.x, myY = self.y;
    game.players[0] = Object.assign(game.players[0] || {}, { x: s.players[0][0], y: s.players[0][1], power: s.players[0][2], inv: s.players[0][3], bombs: s.players[0][4], r: 16, color: PLAYER_COLORS[0] });
    game.players[1] = Object.assign(game.players[1] || {}, { x: myX, y: myY, power: s.players[1][2], inv: s.players[1][3], bombs: s.players[1][4], r: 16, color: PLAYER_COLORS[1] });
    game.lives = s.lives; game.maxLives = s.maxLives; game.score = s.score;
    game.enemies = s.enemies.map(e => ({ type: e[0], x: e[1], y: e[2], hp: e[3], maxHp: ENEMY_TYPES[e[0]].hp, r: ENEMY_TYPES[e[0]].r, color: ENEMY_TYPES[e[0]].color }));
    game.eBullets = s.eBullets.map(b => ({ x: b[0], y: b[1], r: 6 }));
    game.bullets = s.bullets.map(b => ({ x: b[0], y: b[1], vx: b[2], vy: -720, r: 5 }));
    game.powerups = s.powerups.map(p => ({ x: p[0], y: p[1], kind: p[2], r: 13 }));
    for (const ev of s.events) {
      explode(ev[0], ev[1], ev[2], ev[3], 220);
      if (ev[4] && sfx[ev[4]]) sfx[ev[4]]();
    }
    updateHUD();
    if (!running) { running = true; showScreen('game'); }
  }
  function initView() {
    game = {
      players: [new Player(0), new Player(1)],
      lives: 5, maxLives: 5, bullets: [], eBullets: [], enemies: [], powerups: [],
      particles: [], events: [], stars: Array.from({ length: 70 }, () => new Star()),
      score: 0, shake: 0,
    };
    updateHUD();
  }

  // ==================== 更新逻辑 ====================
  function update(dt) {
    const g = game;
    if (waitingForGuest) { for (const s of g.stars) s.update(dt); return; }
    g.time += dt;
    g.shake = Math.max(0, g.shake - dt);
    g.events = [];

    g.players[0].applyInput(dt);
    if (mode === 'host' && g.players[1]) {
      const p1 = g.players[1];
      p1.x = guestX; p1.y = guestY; p1.clamp();
    }
    for (const p of g.players) p.tick(dt);

    g.spawnTimer -= dt;
    if (g.spawnTimer <= 0) { g.spawnTimer = clamp(0.9 - g.time * 0.02, 0.28, 0.9); spawnEnemy(); }
    if (g.time > g.nextBossTime && !g.bossSpawned) spawnBoss();

    for (const b of g.bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
    for (const b of g.eBullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
    for (const e of g.enemies) e.update(dt);
    for (const p of g.powerups) p.update(dt);
    for (const s of g.stars) s.update(dt);
    for (const p of g.particles) p.update(dt);

    g.bullets = g.bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20);
    g.eBullets = g.eBullets.filter(b => b.y < H + 20 && b.x > -20 && b.x < W + 20);
    g.enemies = g.enemies.filter(e => !e.dead);
    g.powerups = g.powerups.filter(p => !p.dead);
    g.particles = g.particles.filter(p => p.life > 0);

    for (const b of g.bullets) {
      if (b.dead) continue;
      for (const e of g.enemies) {
        if (e.dead || b.dead) continue;
        if (circleHit(b, e)) {
          b.dead = true; e.hp--;
          explode(b.x, b.y, '#7ef9ff', 4, 120, 'hit');
          if (e.hp <= 0) {
            e.dead = true; g.kills++;
            addScore(e.score);
            explode(e.x, e.y, e.color, e.type === 3 ? 60 : 18, e.type === 3 ? 350 : 200, 'boom');
            sfx.boom();
            if (e.type === 3) {
              for (let i = 0; i < 4; i++) dropPowerUp(e.x + rand(-40, 40), e.y + rand(-20, 20));
              g.bossSpawned = false; // Boss 被击杀后允许下一波
            }
            else if (Math.random() < 0.18) dropPowerUp(e.x, e.y);
          }
          break;
        }
      }
    }
    g.bullets = g.bullets.filter(b => !b.dead);

    for (let i = 0; i < g.players.length; i++) {
      const pl = g.players[i];
      for (const e of g.enemies) {
        if (!e.dead && circleHit(e, pl)) { e.dead = true; explode(e.x, e.y, e.color, 20, 220, 'boom'); playerHit(i); sfx.boom(); }
      }
      for (const b of g.eBullets) {
        if (!b.dead && circleHit(b, pl)) { b.dead = true; playerHit(i); }
      }
    }
    g.eBullets = g.eBullets.filter(b => !b.dead);

    for (const p of g.powerups) {
      for (let i = 0; i < g.players.length; i++) {
        const pl = g.players[i];
        if (!p.dead && circleHit(p, pl)) {
          p.dead = true; sfx.power();
          if (p.kind === 'P') pl.power = Math.min(5, pl.power + 1);
          else if (p.kind === 'H') g.lives = Math.min(g.maxLives, g.lives + 1);
          else pl.bombs = Math.min(3, pl.bombs + 1);
          explode(p.x, p.y, '#ffffff', 12, 150, 'power');
          updateHUD();
          break;
        }
      }
    }

    if (mode === 'host') {
      Net.stateTimer -= dt;
      if (Net.stateTimer <= 0) { Net.stateTimer = 0.05; Net.sendState(); }
    }
  }

  // ==================== 渲染 ====================
  function drawPlayer(p) {
    if (!p) return;
    if (p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0) return;
    ctx.save();
    ctx.translate(p.x, p.y);
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 34);
    g.addColorStop(0, p.color + '66'); g.addColorStop(1, p.color + '00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = p.color; ctx.strokeStyle = '#eaf6ff'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -22); ctx.lineTo(5, -8); ctx.lineTo(16, 6); ctx.lineTo(10, 14);
    ctx.lineTo(5, 10); ctx.lineTo(0, 16); ctx.lineTo(-5, 10); ctx.lineTo(-10, 14);
    ctx.lineTo(-16, 6); ctx.lineTo(-5, -8); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#eaf6ff';
    ctx.beginPath(); ctx.ellipse(0, -6, 3, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff5544'; ctx.fillRect(-15, 4, 3, 4); ctx.fillRect(12, 4, 3, 4);
    ctx.restore();
  }
  function drawEnemy(e) {
    ctx.save(); ctx.translate(e.x, e.y);
    if (e.type === 3) {
      ctx.fillStyle = '#7a1f2b'; ctx.strokeStyle = '#ff8899'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 40); ctx.lineTo(40, -20); ctx.lineTo(22, -34);
      ctx.lineTo(0, -12); ctx.lineTo(-22, -34); ctx.lineTo(-40, -20);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff3344'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-40, -46, 80, 6);
      ctx.fillStyle = '#ff4455'; ctx.fillRect(-40, -46, 80 * (e.hp / e.maxHp), 6);
    } else {
      ctx.fillStyle = e.color || ENEMY_TYPES[e.type].color;
      ctx.strokeStyle = '#ffd9e0'; ctx.lineWidth = 1.2;
      if (e.type === 0) {
        ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(12, -6); ctx.lineTo(6, -14); ctx.lineTo(0, -8); ctx.lineTo(-6, -14); ctx.lineTo(-12, -6); ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (e.type === 1) {
        ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(15, -8); ctx.lineTo(9, -6); ctx.lineTo(4, -16); ctx.lineTo(-4, -16); ctx.lineTo(-9, -6); ctx.lineTo(-15, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffdd44'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.moveTo(0, 24); ctx.lineTo(18, 6); ctx.lineTo(14, -14); ctx.lineTo(0, -8); ctx.lineTo(-14, -14); ctx.lineTo(-18, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    }
    ctx.restore();
  }
  function drawBullet(b) {
    const g = ctx.createLinearGradient(b.x, b.y - 10, b.x, b.y + 6);
    g.addColorStop(0, '#7ef9ff'); g.addColorStop(1, '#0066ff');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(b.x, b.y, 3.5, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(b.x, b.y - 2, 2.2, 0, Math.PI * 2); ctx.fill();
  }
  function drawEBullet(b) {
    const g = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, 8);
    g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#ff8844'); g.addColorStop(1, 'rgba(255,60,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffdd88';
    ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  function drawPowerup(p) {
    const color = p.kind === 'P' ? '#00e5ff' : p.kind === 'H' ? '#ff5577' : '#ffd94d';
    const letter = p.kind === 'P' ? 'P' : p.kind === 'H' ? '❤' : 'B';
    ctx.save(); ctx.translate(p.x, p.y);
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 18);
    g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.5, color + 'cc'); g.addColorStop(1, color + '00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(letter, 0, 1);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (game && game.shake > 0) ctx.translate(rand(-4, 4) * game.shake, rand(-4, 4) * game.shake);
    if (game) {
      for (const s of game.stars) { ctx.globalAlpha = s.tw; ctx.fillStyle = '#cfe6ff'; ctx.fillRect(s.x, s.y, s.size, s.size); }
      ctx.globalAlpha = 1;
      for (const p of game.powerups) drawPowerup(p);
      for (const e of game.enemies) drawEnemy(e);
      for (const b of game.bullets) drawBullet(b);
      for (const b of game.eBullets) drawEBullet(b);
      for (const p of game.players) drawPlayer(p);
      for (const p of game.particles) {
        const a = clamp(p.life / p.maxLife, 0, 1);
        ctx.globalAlpha = a; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (paused && running) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    }
  }

  // ==================== 主循环 ====================
  let last = performance.now();
  function loop(ts) {
    const dt = Math.min(0.033, (ts - last) / 1000 || 0.016);
    last = ts;
    if (running && !paused && (mode === 'solo' || mode === 'host')) update(dt);
    if (running && !paused && mode === 'guest' && game && game.players && game.players[1]) {
      const self = game.players[1];
      if (self && typeof self.applyInput === 'function') {
        self.applyInput(dt);
        Net.inputTimer = (Net.inputTimer || 0) - dt;
        if (Net.inputTimer <= 0) { Net.inputTimer = 0.033; Net.send({ t: 'input', x: self.x, y: self.y }); }
      }
      for (const s of game.stars) s.update(dt);
      for (const p of game.particles) p.update(dt);
      game.particles = game.particles.filter(p => p.life > 0);
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ==================== 输入 ====================
  const keys = new Set();
  const mouse = { x: W / 2, y: H - 90, active: false };
  window.addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    keys.add(e.key.length === 1 ? e.key.toLowerCase() : e.key);
    if (e.key === ' ' && running && !paused) {
      if (mode === 'solo' || mode === 'host') bomb(0);
      else if (mode === 'guest') Net.send({ t: 'bomb' });
    }
    if (e.key === 'Escape' && running) setPaused(!paused);
  });
  window.addEventListener('keyup', e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) * (W / r.width);
    mouse.y = (e.clientY - r.top) * (H / r.height);
    mouse.active = true;
  });
  canvas.addEventListener('mousedown', () => {
    if (!running || paused) return;
    if (mode === 'solo' || mode === 'host') bomb(0);
    else if (mode === 'guest') Net.send({ t: 'bomb' });
  });

  // ==================== 账号 / 登录 ====================
  async function loadAccounts() {
    try {
      const list = await api('/api/accounts');
      const grid = $('accGrid');
      grid.innerHTML = '';
      for (const a of list) {
        const card = document.createElement('div');
        card.className = 'acc-card';
        card.dataset.uid = a.uid;
        card.innerHTML = `<div class="nm">${a.name}</div><div class="id">${a.uid}</div>`;
        card.onclick = () => {
          document.querySelectorAll('.acc-card').forEach(c => c.classList.remove('sel'));
          card.classList.add('sel');
          selectedUid = a.uid;
        };
        grid.appendChild(card);
      }
    } catch (e) {
      $('loginStatus').textContent = '⚠ 无法连接服务器';
    }
  }

  async function doLogin() {
    if (!selectedUid) { $('loginStatus').textContent = '请先选择一个账户'; return; }
    const password = $('pwdInput').value;
    $('loginStatus').textContent = '登录中...';
    try {
      const data = await api('/api/login', { method: 'POST', body: { uid: selectedUid, password } });
      token = data.token;
      me = { uid: data.uid, name: data.name };
      localStorage.setItem('thunder.token', token);
      connectWS();
      await loadMenu();
      showScreen('menu');
      // 打开邀请链接时，登录后自动加入房间
      if (window._pendingRoom) {
        setTimeout(() => { initAudio(); startManualGuest(window._pendingRoom); }, 400);
        window._pendingRoom = null;
      }
    } catch (e) {
      $('loginStatus').textContent = '⚠ ' + e.message;
    }
  }

  function logout() {
    try { api('/api/logout', { method: 'POST' }); } catch (e) {}
    wsClose();
    token = null; me = { uid: '', name: '' };
    localStorage.removeItem('thunder.token');
    selectedUid = null;
    showScreen('login');
    loadAccounts();
  }

  // ==================== WebSocket ====================
  function connectWS() {
    wsClose();
    if (!token) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws?token=${token}`);
    ws.onmessage = e => { try { onWS(JSON.parse(e.data)); } catch (err) {} };
    ws.onclose = () => { ws = null; if (token && !document.hidden) { clearTimeout(wsRetry); wsRetry = setTimeout(connectWS, 3000); } };
  }
  function wsClose() { clearTimeout(wsRetry); if (ws) { try { ws.close(); } catch (e) {} ws = null; } }
  function wsSend(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

  function onWS(msg) {
    switch (msg.type) {
      case 'presence':
        const f = friends.find(x => x.uid === msg.uid);
        if (f) { f.online = msg.online; if (msg.name) f.name = msg.name; renderFriends(); }
        break;
      case 'invite':
        // 收到邀请
        if (running || inviteState) { wsSend({ type: 'invite-decline', to: msg.from }); return; }
        inviteState = { role: 'guest', peerUid: msg.from, peerName: msg.fromName };
        $('inviteTitle').textContent = '⚔️ 对战邀请';
        $('inviteText').textContent = `${msg.fromName} 邀请你一起游玩，是否接受？`;
        $('inviteModal').classList.remove('hidden');
        break;
      case 'invite-accepted':
        toast(`${msg.fromName} 已接受邀请，正在创建房间...`);
        startHostViaInvite(msg.from);
        break;
      case 'invite-declined':
        toast(`${msg.fromName} 拒绝了邀请`);
        inviteState = null;
        break;
      case 'invite-fail':
        toast('对方不在线，无法邀请');
        inviteState = null;
        break;
      case 'room-offer':
        // 房主发来房间码，自动加入
        $('inviteModal').classList.add('hidden');
        toast(`正在加入 ${msg.fromName} 的房间...`);
        startGuestViaInvite(msg.from, msg.code);
        break;
    }
  }

  // ==================== 菜单 / 好友 / 战绩 ====================
  async function loadMenu() {
    $('myName').textContent = me.name;
    $('myUid').textContent = me.uid;
    $('avatar').textContent = (me.name || '?').charAt(0).toUpperCase();
    await Promise.all([loadFriends(), loadLeaderboard(), loadScores()]);
  }

  async function loadFriends() {
    try {
      friends = await api('/api/friends');
      renderFriends();
    } catch (e) {}
  }
  function renderFriends() {
    const el = $('friendList');
    $('friendCount').textContent = `(${friends.filter(f => f.online).length}/${friends.length} 在线)`;
    if (!friends.length) { el.innerHTML = '<div class="muted">暂无好友，输入好友 UID 添加</div>'; return; }
    el.innerHTML = friends.map(f => `
      <div class="friend-row">
        <span class="dot ${f.online ? 'on' : 'off'}"></span>
        <span class="fname">${f.name}</span>
        <span class="fuid">${f.uid}</span>
        ${f.online ? `<button class="btn small" data-invite="${f.uid}">邀请</button>` : `<span class="muted">离线</span>`}
        <button class="btn small ghost" data-del="${f.uid}">✕</button>
      </div>`).join('');
    el.querySelectorAll('[data-invite]').forEach(b => b.onclick = () => inviteFriend(b.dataset.invite));
    el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => removeFriend(b.dataset.del));
  }

  async function addFriend() {
    const uid = $('addFriendInput').value.trim().toUpperCase();
    if (!uid) return;
    try {
      await api('/api/friends', { method: 'POST', body: { uid } });
      $('addFriendInput').value = '';
      toast('已添加好友');
      await loadFriends();
    } catch (e) { toast('⚠ ' + e.message); }
  }
  async function removeFriend(uid) {
    try {
      await api('/api/friends/' + uid, { method: 'DELETE' });
      await loadFriends();
    } catch (e) {}
  }

  async function loadLeaderboard() {
    try {
      const rows = await api('/api/leaderboard');
      $('lbList').innerHTML = rows.slice(0, 10).map((r, i) => `
        <div class="lb-row">
          <span style="width:22px;color:#ffd94d;text-align:center">${i + 1}</span>
          <span class="dot ${r.online ? 'on' : 'off'}"></span>
          <span class="fname">${r.name}</span>
          <span class="fuid">${r.uid}</span>
          <span style="color:#ffd94d;margin-left:auto">${r.best}</span>
        </div>`).join('') || '<div class="muted">暂无数据</div>';
    } catch (e) {}
  }
  async function loadScores() {
    try {
      const list = await api('/api/scores');
      const fmt = ts => { const d = new Date(ts); const p = n => String(n).padStart(2, '0'); return `${d.getMonth() + 1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
      $('myScores').innerHTML = list.slice(0, 5).map(s => `
        <div class="friend-row">
          <span class="fname">${fmt(s.ts)} · ${s.mode === 'solo' ? '单人' : '联机'}</span>
          <span style="color:#ffd94d;margin-left:auto">${s.score}分</span>
          <span class="muted">击落${s.kills}</span>
        </div>`).join('') || '<div class="muted">暂无记录</div>';
    } catch (e) {}
  }

  // ==================== 邀请 / 联机流程 ====================
  function inviteFriend(uid) {
    if (!uid) return;
    inviteState = { role: 'host', peerUid: uid };
    wsSend({ type: 'invite', to: uid });
    toast('已发送邀请，等待对方回应...');
  }

  function startHostViaInvite(peerUid) {
    inviteState = { role: 'host', peerUid, peerName: '' };
    if (!Net.available()) { toast('⚠ 网络模块加载失败'); inviteState = null; return; }
    mode = 'host';
    waitingForGuest = true;
    initGame(2);
    $('roomHint').textContent = '已邀请好友，等待加入...';
    $('roomStatus').textContent = '等待好友加入...';
    $('btnCopy').style.display = 'none';
    showScreen('room');
    Net.host();
  }

  function startGuestViaInvite(fromUid, code) {
    if (!Net.available()) { toast('⚠ 网络模块加载失败'); return; }
    mode = 'guest';
    initView();
    $('roomHint').textContent = '正在连接好友房间...';
    $('roomStatus').textContent = '正在连接...';
    $('btnCopy').style.display = 'none';
    showScreen('room');
    initAudio();
    Net.join(code);
    startBGM();
  }

  // ==================== 初始化 Net 回调 ====================
  Net.onOpen = code => { $('roomCode').textContent = code; };
  Net.onGuestJoin = () => {
    if (mode === 'host') {
      waitingForGuest = false;
      $('roomStatus').textContent = '好友已加入！';
      sfx.join();
      showScreen('game');
    }
  };
  Net.onPeerLeft = () => {
    if (mode === 'host' && running) {
      toast('好友已离开');
      $('roomStatus').textContent = '对方已离开';
      showScreen('room');
    } else if (mode === 'host') {
      $('roomStatus').textContent = '对方已离开，等待新玩家...';
      waitingForGuest = true;
    }
  };
  Net.onConnected = () => { $('roomStatus').textContent = '已连接，等待房主开始...'; };
  Net.onHostLeft = () => {
    if (running) endGame();
    toast('房主已离开');
    showScreen('menu');
    loadMenu();
  };
  Net.onError = e => {
    if (e.type === 'peer-unavailable') {
      toast('⚠ 未找到该房间，请确认房间码');
      showScreen('menu');
      loadMenu();
    }
  };

  // ==================== 开始游戏（单人 / 房间） ====================
  function startSolo() {
    mode = 'solo';
    initGame(1);
    showScreen('game');
    startBGM();
  }
  function startManualHost() {
    if (!Net.available()) { toast('⚠ 网络模块加载失败'); return; }
    mode = 'host';
    waitingForGuest = true;
    inviteState = null;
    initGame(2);
    $('roomHint').textContent = '房间码（分享给好友）';
    $('roomStatus').textContent = '等待玩家加入...';
    $('btnCopy').style.display = '';
    showScreen('room');
    Net.host();
    startBGM();
  }
  function startManualGuest(code) {
    if (!Net.available()) { toast('⚠ 网络模块加载失败'); return; }
    mode = 'guest';
    initView();
    $('roomHint').textContent = '正在连接房间...';
    $('roomStatus').textContent = '正在连接 ' + code + ' ...';
    $('btnCopy').style.display = 'none';
    showScreen('room');
    Net.join(code);
    startBGM();
  }

  function leaveRoom() {
    Net.close();
    running = false; paused = false;
    mode = 'solo'; game = null;
    inviteState = null;
    stopBGM();
    showScreen('menu');
    loadMenu();
  }

  // 暂停 / 退出
  function setPaused(v) {
    if (!running) return;
    paused = v;
    $('pauseMenu').classList.toggle('hidden', !v);
    if (v && game) $('pauseScore').textContent = '当前得分 ' + game.score;
  }

  function quitGame() {
    if (!running) return;
    running = false; paused = false;
    $('pauseMenu').classList.add('hidden');
    stopBGM();
    // 记录当前得分（中途退出也保存战绩）
    recordScore();
    // 联机时通知对方本局结束
    if (mode === 'host') Net.send({ t: 'over', score: game.score });
    if (mode === 'host' || mode === 'guest') Net.close();
    mode = 'solo'; game = null;
    inviteState = null;
    showScreen('menu');
    loadMenu();
  }

  // ==================== UI 事件 ====================
  $('btnLogin').addEventListener('click', () => { initAudio(); doLogin(); });
  $('pwdInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('btnLogout').addEventListener('click', logout);
  $('btnEditName').addEventListener('click', editName);
  $('btnSolo').addEventListener('click', () => { initAudio(); startSolo(); });
  $('btnHost').addEventListener('click', () => { initAudio(); startManualHost(); });
  $('btnJoinRoom').addEventListener('click', () => {
    initAudio();
    const code = $('joinRoomInput').value.trim().toUpperCase();
    if (!code) { toast('请输入房间码'); return; }
    startManualGuest(code);
  });
  $('joinRoomInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('btnJoinRoom').click();
  });
  $('btnAddFriend').addEventListener('click', addFriend);
  $('addFriendInput').addEventListener('keydown', e => { if (e.key === 'Enter') addFriend(); });
  $('btnAccept').addEventListener('click', () => {
    $('inviteModal').classList.add('hidden');
    if (inviteState && inviteState.role === 'guest') {
      wsSend({ type: 'invite-accept', to: inviteState.peerUid });
      toast('已接受邀请，等待对方创建房间...');
    }
  });
  $('btnDecline').addEventListener('click', () => {
    $('inviteModal').classList.add('hidden');
    if (inviteState && inviteState.role === 'guest') wsSend({ type: 'invite-decline', to: inviteState.peerUid });
    inviteState = null;
  });
  $('btnCopy').addEventListener('click', async () => {
    const base = location.href.split('?')[0];
    const link = `${base}?room=${Net.code}&invite=${encodeURIComponent(me.name)}`;
    try {
      await navigator.clipboard.writeText(link);
      $('roomStatus').textContent = '✅ 邀请链接已复制，发给好友即可！';
    } catch (e) { $('roomStatus').textContent = '复制失败，请手动复制：' + link; }
  });
  $('btnLeave').addEventListener('click', leaveRoom);
  $('btnResume').addEventListener('click', () => setPaused(false));
  $('btnQuitGame').addEventListener('click', quitGame);
  $('btnHudQuit').addEventListener('click', () => { if (running) setPaused(true); });
  $('btnMusic').addEventListener('click', toggleBGM);
  $('btnRestart').addEventListener('click', () => {
    if (mode === 'solo') { initGame(1); showScreen('game'); }
    else if (mode === 'host') { initGame(2); Net.send({ t: 'restart' }); showScreen('game'); }
  });
  $('btnMenu').addEventListener('click', leaveRoom);

  function editName() {
    const cur = me.name;
    const input = document.createElement('input');
    input.type = 'text'; input.value = cur; input.maxLength = 16;
    input.style.cssText = 'padding:4px 8px;font-size:15px;width:120px;text-align:left;';
    const span = $('myName');
    span.innerHTML = '';
    span.appendChild(input);
    input.focus();
    const save = async () => {
      const name = input.value.trim();
      if (!name || name === cur) { $('myName').textContent = cur; return; }
      try {
        const r = await api('/api/name', { method: 'POST', body: { name } });
        me.name = r.name;
        $('myName').textContent = me.name;
        $('avatar').textContent = me.name.charAt(0).toUpperCase();
        toast('昵称已更新');
      } catch (e) { $('myName').textContent = cur; toast('⚠ ' + e.message); }
    };
    input.onblur = save;
    input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
  }

  // ==================== 启动 ====================
  async function bootstrap() {
    loadAccounts();
    // URL 带 ?room= 房间码：登录后自动加入
    const roomParam = (new URLSearchParams(location.search).get('room') || '').trim().toUpperCase();
    if (token) {
      try {
        const data = await api('/api/me');
        me = { uid: data.uid, name: data.name };
        connectWS();
        await loadMenu();
        showScreen('menu');
        if (roomParam) {
          window._pendingRoom = roomParam;
          setTimeout(() => { initAudio(); startManualGuest(roomParam); }, 500);
        }
      } catch (e) {
        token = null;
        localStorage.removeItem('thunder.token');
        showScreen('login');
        if (roomParam) {
          window._pendingRoom = roomParam;
          $('loginStatus').textContent = '登录后自动加入房间 ' + roomParam;
        }
      }
    } else {
      showScreen('login');
      if (roomParam) {
        window._pendingRoom = roomParam;
        $('loginStatus').textContent = '登录后自动加入房间 ' + roomParam;
      }
    }
  }

  bootstrap();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
